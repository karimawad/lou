name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check the build has no third-party URLs
        run: |
          if grep -rEl "https?://(www\.)?(google-analytics|googletagmanager|cdn\.|fonts\.g)" dist/assets dist/index.html; then
            echo "Found a third-party URL in the build"; exit 1
          fi
