# OpenLiteSpeed virtual host for Lou. Save as /usr/local/lsws/conf/vhosts/Lou/vhconf.conf (see DEPLOY.md).
# The certificate lines are added by the SSL step (certbot or WebAdmin), so they are not here.
# Headers mirror app/public/_headers. Keep the two in step.

docRoot                   $VH_ROOT/current/
vhDomain                  lou.bigtimedesign.ca
enableGzip                1
enableBr                  1

index  {
  useServer               0
  indexFiles              index.html
}

# Privacy policy promise: server logs are kept up to 14 days.
errorlog $VH_ROOT/logs/error.log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
  keepDays                14
  compressArchive         1
}

accesslog $VH_ROOT/logs/access.log {
  useServer               0
  logHeaders              0
  rollingSize             10M
  keepDays                14
  compressArchive         1
}

errorpage 404 {
  url                     /404.html
}

# Everything by default: always revalidate (the page, service worker, manifest, forms, OCR files).
context / {
  location                $DOC_ROOT/
  allowBrowse             1
  extraHeaders            <<<END_extraHeaders
Cache-Control: no-cache
Strict-Transport-Security: max-age=31536000; includeSubDomains
X-Content-Type-Options: nosniff
Referrer-Policy: no-referrer
X-Frame-Options: DENY
Permissions-Policy: camera=(self), microphone=(), geolocation=(), payment=()
Content-Security-Policy: default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' blob: data:; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'
END_extraHeaders
}

# Built files have a hash in their name and never change: cache for a year.
context /assets/ {
  location                $DOC_ROOT/assets/
  allowBrowse             1
  extraHeaders            <<<END_extraHeaders
Cache-Control: public, max-age=31536000, immutable
Strict-Transport-Security: max-age=31536000; includeSubDomains
X-Content-Type-Options: nosniff
Referrer-Policy: no-referrer
X-Frame-Options: DENY
Permissions-Policy: camera=(self), microphone=(), geolocation=(), payment=()
Content-Security-Policy: default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' blob: data:; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'
END_extraHeaders
}

# Send people who type http:// to https://. Let's Encrypt checks (/.well-known/acme-challenge/) stay on http.
rewrite  {
  enable                  1
  rules                   <<<END_rules
RewriteCond %{HTTPS} !on
RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
END_rules
}
